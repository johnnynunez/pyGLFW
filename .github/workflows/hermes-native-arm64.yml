name: Fork ARM64 validation - pyGLFW
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-c4aa016c6bbd
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fork-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wheel:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: c4aa016c6bbd1ca6ffd22e6a7b365b0fb2a8da07
    - name: Verify exact public PR source revision
      shell: pwsh
      run: '$actual = git rev-parse HEAD

        if ($actual -ne ''c4aa016c6bbd1ca6ffd22e6a7b365b0fb2a8da07'') { throw ''Source revision mismatch'' }

        Write-Output (''TESTED_SOURCE_SHA=''+$actual)'
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        architecture: arm64
    - name: Check out GLFW 3.4
      uses: actions/checkout@v4
      with:
        repository: glfw/glfw
        ref: 7b6aead9fb88b3623e3b3725ebb42670cbe4c579
        path: glfw-source
        persist-credentials: false
    - name: Build native GLFW with the static C runtime
      run: 'cmake -S glfw-source -B glfw-build -A ARM64 -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF -DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        cmake --build glfw-build --config Release --parallel 2

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        Copy-Item glfw-build/src/Release/glfw3.dll glfw/glfw3.dll

        '
    - name: Package wheel
      run: 'python -m pip install setuptools wheel

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        python setup.py bdist_wheel --python-tag py3 --plat-name win_arm64

        '
    - name: Test installed wheel without a library override
      run: 'python -m venv wheel-test

        $python = (Resolve-Path wheel-test/Scripts/python.exe).Path

        & $python -m pip install (Get-ChildItem dist/*.whl).FullName

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Leave the source tree so the import comes from the wheel.

        Copy-Item tests/check_windows_arm64.py $env:RUNNER_TEMP/check_windows_arm64.py

        Set-Location $env:RUNNER_TEMP

        & $python check_windows_arm64.py

        '
    - uses: actions/upload-artifact@v4
      with:
        name: glfw-win-arm64-${{ matrix.python }}
        path: dist/*.whl
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python:
        - '3.12'
        - '3.13'
    permissions:
      contents: read
    timeout-minutes: 60
    if: github.repository_owner == 'johnnynunez'
